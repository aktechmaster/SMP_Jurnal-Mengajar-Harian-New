<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMH Smart Input System v2.0</title>
    <link rel="icon" type="image/png" href="logosmpit.png">
    <link rel="shortcut icon" type="image/png" href="logosmpit.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link ke file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logosmpit.png" alt="Logo SMPIT" class="header-logo">
        <h2>Jurnal Mengajar Harian</h2>
        <p>Smart Input System v2.0</p>
    </div>

    <form id="jurnalForm">
        <div class="input-group">
            <label>Email Report</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-paper-plane"></i>
                <input type="email" id="emailGuru" class="form-control" placeholder="nama@sekolah.sch.id" autocomplete="email" required>
            </div>
            <small style="color: #94a3b8; font-size: 0.75rem; margin-top:5px; display:block;">*Bukti PDF akan dikirim ke email ini</small>
        </div>

        <div class="input-group">
            <label>Guru Pengampu</label>
            <select id="guru" class="form-control" required><option>Initialize System...</option></select>
        </div>

        <div class="input-group">
            <label>Mapel</label>
            <select id="mapel" class="form-control" required><option>Loading Data...</option></select>
        </div>

        <div class="input-group">
            <label>Kelas</label>
            <select id="kelas" class="form-control" required onchange="loadSiswa()"><option>Select Class...</option></select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 15px; align-items: start;">
            <div class="input-group">
                <label>Pertemuan</label>
                <input type="number" id="pertemuan" class="form-control" placeholder="1" required>
            </div>

            <div class="input-group">
                <label>Media (Multi-Select)</label>
                <div class="checkbox-grid media-grid">
                    <div class="cb-item">
                        <input type="checkbox" name="media_alat" value="LCD Proyektor" id="m1">
                        <label for="m1">📽 LCD</label>
                    </div>
                    <div class="cb-item">
                        <input type="checkbox" name="media_alat" value="Speaker" id="m2">
                        <label for="m2">🔊 Speaker</label>
                    </div>
                    <div class="cb-item">
                        <input type="checkbox" name="media_alat" value="Smart TV" id="m3">
                        <label for="m3">📺 Smart TV</label>
                    </div>
                    <div class="cb-item">
                        <input type="checkbox" name="media_alat" value="Whiteboard" id="m4">
                        <label for="m4">📝 Board</label>
                    </div>
                    <div class="cb-item">
                        <input type="checkbox" name="media_alat" value="Laboratorium" id="m5">
                        <label for="m5">🧪 Lab</label>
                    </div>
                    <div class="cb-item">
                        <input type="checkbox" name="media_alat" value="Lainnya" id="m6">
                        <label for="m6">✨ Lainnya</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>Pokok Materi</label>
            <input type="text" id="materi" class="form-control" placeholder="Materi hari ini..." required>
        </div>

        <div class="input-group">
            <label>Deskripsi Kegiatan</label>
            <textarea id="kegiatan" class="form-control" rows="3" placeholder="Deskripsi singkat kegiatan..."></textarea>
        </div>

        <div class="input-group">
            <label>Jam Ke</label>
            <!-- Kontainer untuk Checkbox Jam Ke (diisi oleh JavaScript) -->
            <div class="checkbox-grid" id="containerJamKe"></div>
        </div>

        <div class="input-group">
            <label>Bukti KBM (Photo)</label>
            
            <input type="file" id="inputKamera" accept="image/*" capture="environment" style="display: none;">
            <input type="file" id="inputGaleri" accept="image/*" style="display: none;">
            <input type="file" id="buktiKBM" name="buktiKBM" required style="opacity: 0; position: absolute; width: 1px; height: 1px;">

            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <button type="button" onclick="document.getElementById('inputKamera').click()" style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; color: #334155;">
                    <i class="fa-solid fa-camera" style="color: #0284c7;"></i> Kamera
                </button>
                <button type="button" onclick="document.getElementById('inputGaleri').click()" style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; color: #334155;">
                    <i class="fa-solid fa-image" style="color: #16a34a;"></i> Galeri
                </button>
            </div>
            <small id="namaFilePilihan" style="color: #0284c7; font-size: 0.8rem; margin-top: 6px; display: block; font-weight: 500;">
                *Belum ada foto dipilih
            </small>
        </div>
        
        <div class="input-group">
            <label>Catatan Pengamatan</label>
            <textarea id="catatan" class="form-control" rows="2" style="overflow: hidden; resize: none;" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" placeholder="Contoh: Siswa kelas 8A sangat aktif, namun ada kendala mati lampu sejenak saat jam ke-3..."></textarea>
        </div>

        <!-- --- BAGIAN REFLEKSI PEMBELAJARAN --- -->
        <div style="margin-top: 25px; border-top: 2px dashed #e2e8f0; padding-top: 20px; margin-bottom: 10px;">
            <h3 style="font-size: 1rem; color: var(--primary); margin-bottom: 15px; margin-top: 0;">💡 REFLEKSI PEMBELAJARAN</h3>
            
            <div class="input-group">
                <label>Keberhasilan</label>
                <textarea id="keberhasilan" class="form-control" rows="2" placeholder="Contoh: Siswa sangat antusias dan aktif saat diskusi kelompok..."></textarea>
            </div>

            <div class="input-group">
                <label>Perbaikan</label>
                <textarea id="perbaikan" class="form-control" rows="2" placeholder="Contoh: Manajemen waktu presentasi perlu diperbaiki agar tidak molor..."></textarea>
            </div>

            <div class="input-group">
                <label>Rencana Tindak Lanjut</label>
                <textarea id="rtl" class="form-control" rows="2" placeholder="Contoh: Menyiapkan timer interaktif untuk membatasi waktu tiap kelompok..."></textarea>
            </div>
        </div>
        
        <div style="margin-top: 30px; border-top: 2px dashed #e2e8f0; padding-top: 20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <label style="margin:0; font-size:1rem; color:var(--primary);">PRESENSI SISWA</label>
                <div id="loading-siswa" style="display:none; color: var(--accent); font-size:0.8rem; font-weight:600;">
                    <span class="loader" style="border-color: var(--accent); border-bottom-color: transparent; width:14px; height:14px;"></span> Syncing...
                </div>
            </div>
            <div id="student-list" style="text-align: center; color: #94a3b8; font-style: italic; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                Silakan pilih kelas terlebih dahulu
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="kirimData()" id="btnKirim">UPLOAD DATA <i class="fa-solid fa-rocket"></i></button>

        <div class="footer-credit">
            &copy; 2026<span>SMP IT Al-Kautsar Mukomuko</span> <br>
            Designed & Developed by aktechmaster
        </div>
    </form>
</div>

<!-- SweetAlert2 CDN -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- Link ke file JavaScript eksternal -->
<script src="script.js"></script>

</body>
</html>
